name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mistral-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the PR reviewer without API calls or secrets
        run: python3 -B -m unittest discover -s tests

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2 + BSD grep/sed/awk: recon.sh must work on both.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck plugin/skills/auditar-repo/scripts/recon.sh tests/*.sh tests/eval/*.sh tests/stubs/*
      - name: tests
        run: bash tests/run.sh
