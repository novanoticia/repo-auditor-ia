name: Mistral Eval

# Evaluación manual del revisor con casos reales del historial de este repo
# (.github/eval/casos.json; plantilla en mistral-review/ejemplos/eval-casos.json).
# No se lanza sola: cada solicitud cuesta dinero.
on:
  workflow_dispatch:
    inputs:
      repeticiones:
        description: Revisiones por caso
        default: '2'
      solo:
        description: Ids de casos separados por comas (vacío = todos)
        default: ''
      contexto:
        description: Contexto de la evaluación
        type: choice
        default: estandar
        options:
          - estandar
          - auxiliar-local
      modelo:
        description: Modelo solo para esta evaluación (vacío = MISTRAL_MODEL; con OpenRouter, organización/modelo)
        default: ''
      esfuerzo:
        description: Esfuerzo de razonamiento, low, medium o high (vacío = el del revisor)
        default: ''
      max_salida:
        description: Tope de tokens de salida, 4000 a 256000 (vacío = el del revisor)
        default: ''

concurrency:
  group: mistral-eval
  cancel-in-progress: false

jobs:
  mistral-eval:
    permissions:
      contents: read
    uses: novanoticia/mistral-review/.github/workflows/eval.yml@v1.7
    with:
      # Debe coincidir con la etiqueta de `uses:` (versión fija de mistral-review).
      ref: v1.7
      repeticiones: ${{ inputs.repeticiones }}
      solo: ${{ inputs.solo }}
      contexto: ${{ inputs.contexto }}
      modelo: ${{ inputs.modelo }}
      esfuerzo: ${{ inputs.esfuerzo }}
      max_salida: ${{ inputs.max_salida }}
      # Proveedor (ver README de mistral-review, «Usar OpenRouter»): sin la variable MISTRAL_PROVIDER,
      # o con `mistral`, revisa Mistral con MISTRAL_MODEL; con `openrouter`, OpenRouter
      # con OPENROUTER_MODEL. Cambiar de proveedor = cambiar solo MISTRAL_PROVIDER.
      model: ${{ vars.MISTRAL_PROVIDER == 'openrouter' && vars.OPENROUTER_MODEL || vars.MISTRAL_PROVIDER != 'openrouter' && vars.MISTRAL_MODEL || '' }}
      provider: ${{ vars.MISTRAL_PROVIDER }}
      openrouter_provider: ${{ vars.OPENROUTER_PROVIDER }}
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
