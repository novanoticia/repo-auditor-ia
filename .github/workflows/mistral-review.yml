name: Mistral PR Review

on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened, edited]

# Un push nuevo cancela la revisión anterior del mismo PR.
concurrency:
  group: mistral-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # El revisor vive en novanoticia/mistral-review; aquí solo se llama.
  # Sin exclusiones: no hay archivos generados.
  mistral-review:
    permissions:
      pull-requests: write
      contents: read
    uses: novanoticia/mistral-review/.github/workflows/review.yml@v1.3
    with:
      # Debe coincidir con la etiqueta de `uses:` (versión fija de mistral-review).
      ref: v1.3
      model: ${{ vars.MISTRAL_MODEL }}
      # Vacío (sin la variable) = Mistral. Para OpenRouter: MISTRAL_PROVIDER=openrouter,
      # MISTRAL_MODEL con forma organización/modelo y el secreto OPENROUTER_API_KEY.
      provider: ${{ vars.MISTRAL_PROVIDER }}
      openrouter_provider: ${{ vars.OPENROUTER_PROVIDER }}
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
